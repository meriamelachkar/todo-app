services:
  postgres:
    image: postgres:16
    container_name: todoapp-dev-db
    environment:
      POSTGRES_DB: todoapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - todoapp_dev_postgres_data:/var/lib/postgresql/data

volumes:
  todoapp_dev_postgres_data: